name: FocusBlock
options:
  bundleIdPrefix: com.focusblock
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"

targets:
  FocusBlock:
    type: application
    platform: iOS
    sources:
      - path: Sources/FocusBlock
      - path: Sources/Shared
    info:
      path: Sources/FocusBlock/Info.plist
      properties:
        CFBundleDisplayName: Focus Block
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [armv7]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Sources/FocusBlock/FocusBlock.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.focusblock.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusblock.app
        PRODUCT_NAME: Focus Block
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ${APP_PROFILE_NAME}
    dependencies:
      - target: FocusBlockMonitor
        embed: true

  FocusBlockMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/FocusBlockMonitor
      - path: Sources/Shared
    info:
      path: Sources/FocusBlockMonitor/Info.plist
      properties:
        CFBundleDisplayName: Focus Block Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FocusBlockMonitorExtension
    entitlements:
      path: Sources/FocusBlockMonitor/FocusBlockMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.focusblock.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusblock.app.monitor
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ${MONITOR_PROFILE_NAME}

schemes:
  FocusBlock:
    build:
      targets:
        FocusBlock: all
    archive:
      config: Release
